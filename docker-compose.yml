services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: app/backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - mongo
    ports:
      - "8000:8000"
volumes:
  mongo_data: