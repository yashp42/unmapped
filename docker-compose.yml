services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: app/backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      - mongo
    ports:
      - "8001:8001"
  frontend:
    build:
      context: app/frontend
      args:
        REACT_APP_BACKEND_URL: http://localhost:8001
    depends_on:
      - backend
    ports:
      - "3000:80"
volumes:
  mongo_data:
